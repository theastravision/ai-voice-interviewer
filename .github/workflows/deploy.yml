name: Build Images & Deploy to AWS + Salad

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Salad Cloud GPU Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./salad-gpu-worker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-salad-gpu:latest

      - name: Build & Push AWS FastAPI Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./aws-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-aws-backend:latest

      - name: Build & Push Frontend UI Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-frontend:latest

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # .env file create karo project folder mein
            printf 'DOCKERHUB_USERNAME=%s\n'    '${{ secrets.DOCKERHUB_USERNAME }}'  > ~/ai-voice-interview/.env
            printf 'WRITER_DB_URL=%s\n'         '${{ secrets.RDS_WRITER_URL }}'     >> ~/ai-voice-interview/.env
            printf 'READER_DB_URL=%s\n'         '${{ secrets.RDS_READER_URL }}'     >> ~/ai-voice-interview/.env
            printf 'SALAD_GATEWAY_URL=%s\n'     '${{ secrets.SALAD_GATEWAY_URL }}'  >> ~/ai-voice-interview/.env
            printf 'SALAD_API_SECRET=%s\n'      '${{ secrets.SALAD_API_SECRET }}'   >> ~/ai-voice-interview/.env

            # Docker images pull karo
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/interview-aws-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/interview-frontend:latest

            # docker-compose run karo .env file ke saath
            docker compose -f ~/docker-compose.aws.yml --env-file ~/ai-voice-interview/.env up -d
