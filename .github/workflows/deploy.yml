name: Build Images & Deploy to AWS + Salad

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Salad Cloud GPU Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./salad-gpu-worker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-salad-gpu:latest

      - name: Build & Push AWS FastAPI Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./aws-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-aws-backend:latest

      - name: Build & Push Frontend UI Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-frontend:latest

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.aws.yml"
          target: "~/"

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Project directory ensure karo
            mkdir -p ~/ai-voice-interview

            # .env file fresh banao (secrets se)
            cat > ~/ai-voice-interview/.env << 'ENVEOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            RDS_WRITER_URL=${{ secrets.RDS_WRITER_URL }}
            RDS_READER_URL=${{ secrets.RDS_READER_URL }}
            SALAD_GATEWAY_URL=${{ secrets.SALAD_GATEWAY_URL }}
            SALAD_API_SECRET=${{ secrets.SALAD_API_SECRET }}
            ENVEOF

            # Verify .env bana
            echo "✅ .env file:"
            cat ~/ai-voice-interview/.env

            # Latest images pull karo
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/interview-aws-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/interview-frontend:latest

            # Purane containers band karo aur naye start karo
            docker compose -f ~/docker-compose.aws.yml --env-file ~/ai-voice-interview/.env down
            docker compose -f ~/docker-compose.aws.yml --env-file ~/ai-voice-interview/.env up -d

            # Status check
            echo "🚀 Running containers:"
            docker ps
