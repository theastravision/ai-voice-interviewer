name: Build Images & Deploy to AWS + Salad

on:
  push:
    branches: [ "main" ]

jobs:
  # ─── Step 1: Detect which folders changed ───────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      salad:    ${{ steps.filter.outputs.salad }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'aws-backend/**'
            frontend:
              - 'frontend/**'
            salad:
              - 'salad-gpu-worker/**'

  # ─── Step 2: Build only changed images ──────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout Git Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (for caching)
        uses: docker/setup-buildx-action@v3

      # ── Salad GPU Worker (always rebuild — EC2 depends on latest GPU routes) ──
      - name: Build & Push Salad GPU Worker Image
        uses: docker/build-push-action@v6
        with:
          context: ./salad-gpu-worker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-salad-gpu:latest
          cache-from: type=gha,scope=salad
          cache-to:   type=gha,scope=salad,mode=max
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}

      # ── FastAPI Backend (only if aws-backend/ changed) ──
      - name: Build & Push AWS FastAPI Backend Image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./aws-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-aws-backend:latest
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # ── Frontend (only if frontend/ changed) ──
      - name: Build & Push Frontend UI Image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/interview-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      # ─── Step 3: Copy updated compose file to EC2 ───────────────────────────
      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.aws.yml"
          target: "~/"

      # ─── Step 4: Deploy on EC2 ───────────────────────────────────────────────
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/ai-voice-interview

            # .env file fresh create (no leading spaces)
            echo 'DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}'  > ~/ai-voice-interview/.env
            echo 'RDS_WRITER_URL=${{ secrets.RDS_WRITER_URL }}'        >> ~/ai-voice-interview/.env
            echo 'RDS_READER_URL=${{ secrets.RDS_READER_URL }}'        >> ~/ai-voice-interview/.env
            echo 'SALAD_GATEWAY_URL=${{ secrets.SALAD_GATEWAY_URL }}'  >> ~/ai-voice-interview/.env
            echo 'SALAD_API_SECRET=${{ secrets.SALAD_API_SECRET }}'    >> ~/ai-voice-interview/.env
            chmod 600 ~/ai-voice-interview/.env

            # Verify .env contents
            echo "✅ .env file created:"
            cat ~/ai-voice-interview/.env

            # Latest images pull karo
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/interview-aws-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/interview-frontend:latest

            # Restart containers
            docker compose -f ~/docker-compose.aws.yml --env-file ~/ai-voice-interview/.env down
            docker compose -f ~/docker-compose.aws.yml --env-file ~/ai-voice-interview/.env up -d

            echo "🚀 Containers running:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
